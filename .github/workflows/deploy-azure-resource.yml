name: Deploy Azure Resource (Demo)

on:
  workflow_dispatch:
    inputs:
      resourceGroupName:
        description: "Name of the Azure resource group to create"
        required: true
        default: "tasktracker-demo-rg"
      location:
        description: "Azure region"
        required: true
        default: "eastus"

permissions:
  id-token: write   # required for OIDC login - lets GitHub request a short-lived Azure token, no stored password
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC - no client secret stored in GitHub)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group
        run: |
          az group create \
            --name "${{ inputs.resourceGroupName }}" \
            --location "${{ inputs.location }}"

      - name: Deploy a storage account (example resource)
        run: |
          az storage account create \
            --name "tttraining$RANDOM" \
            --resource-group "${{ inputs.resourceGroupName }}" \
            --location "${{ inputs.location }}" \
            --sku Standard_LRS

      - name: Show what was deployed
        run: |
          az resource list --resource-group "${{ inputs.resourceGroupName }}" --output table
